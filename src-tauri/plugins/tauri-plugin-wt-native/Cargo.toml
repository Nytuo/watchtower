[package]
name = "tauri-plugin-wt-native"
version = "0.1.0"
description = "Watchtower mobile glue: Bonjour/NSD discovery, Android Keystore secrets, background keep-alive."
edition = "2021"
links = "tauri-plugin-wt-native"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
