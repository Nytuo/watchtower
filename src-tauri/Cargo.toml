[package]
name = "watchtower"
version = "0.1.0"
edition = "2021"
description = "Privacy-first SSH/SFTP/FTP client"

[lib]
name = "watchtower_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
futures = "0.3"

# Crypto
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["std"] }
rand = "0.8"

# SSH
russh = "0.46"
russh-keys = "0.46"
russh-sftp = "2.1.1"
async-trait = "0.1"
