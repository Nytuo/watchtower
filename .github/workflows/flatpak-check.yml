name: flatpak-check

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'packaging/flatpak/**'
      - '.github/workflows/flatpak-check.yml'
  workflow_dispatch:

jobs:
  sources:
    name: Generated sources are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate and compare
        run: |
          set -euo pipefail
          pip install --quiet aiohttp toml tomlkit \
            "git+https://github.com/flatpak/flatpak-builder-tools.git#subdirectory=node"
          curl -fsSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 flatpak-cargo-generator.py src-tauri/Cargo.lock -o packaging/flatpak/cargo-sources.json
          python3 -m flatpak_node_generator npm package-lock.json -o packaging/flatpak/node-sources.json
          if ! git diff --quiet -- packaging/flatpak/cargo-sources.json packaging/flatpak/node-sources.json; then
            git diff --stat -- packaging/flatpak/cargo-sources.json packaging/flatpak/node-sources.json
            echo "::error::packaging/flatpak/cargo-sources.json / node-sources.json are stale. Regenerate them (see packaging/flatpak/README.md) and commit."
            exit 1
          fi

  build:
    name: Build Flatpak
    needs: sources
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/fr.nytuo.watchtower.yml
          bundle: watchtower.flatpak
          cache-key: flatpak-builder-${{ github.sha }}
